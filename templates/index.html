<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Biometric Identification Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #090d16;
            --bg-surface: #111827;
            --bg-surface-hover: #1f293d;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-green-bg: rgba(34, 197, 94, 0.12);
            --accent-red-bg: rgba(239, 68, 68, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Top Navbar */
        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            padding-left: max(2rem, env(safe-area-inset-left));
            padding-right: max(2rem, env(safe-area-inset-right));
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.01em;
            min-width: 0;
        }

        .logo-group span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            color: var(--accent-blue);
            flex-shrink: 0;
        }

        .system-status { flex-shrink: 0; }

        .system-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-sub);
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            white-space: nowrap;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            flex-shrink: 0;
        }

        /* Main Workspace */
        main {
            max-width: 1320px;
            margin: 0 auto;
            width: 100%;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 2rem;
            flex: 1;
        }

        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .card-header {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-sub);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-header svg { flex-shrink: 0; }

        /* Video Feed Panel */
        .viewport-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9; /* fallback until video metadata loads */
            background-color: #030712;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: block;
        }

        /* Sidebar Controls */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            min-width: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        input[type="text"] {
            background-color: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 1rem; /* >= 16px prevents iOS zoom on focus */
            outline: none;
            transition: border-color 0.2s ease;
            width: 100%;
            min-height: 44px;
        }

        input[type="text"]:focus {
            border-color: var(--accent-blue);
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: #000000;
            border: none;
            padding: 0.85rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            min-height: 48px;
            touch-action: manipulation;
        }

        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:active { opacity: 0.8; }

        /* Status Toast */
        .status-box {
            font-size: 0.875rem;
            padding: 0.85rem 1rem;
            border-radius: 6px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-box.success {
            background: var(--accent-green-bg);
            border-color: rgba(34, 197, 94, 0.3);
            color: var(--accent-green);
        }

        .status-box.error {
            background: var(--accent-red-bg);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
        }

        /* Telemetry Feed */
        .log-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 220px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.85rem;
            background-color: var(--bg-base);
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .identity-badge {
            font-weight: 600;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .identity-badge.known { color: var(--accent-green); }
        .identity-badge.unknown { color: var(--accent-red); }

        .confidence-val {
            color: var(--text-muted);
            font-family: monospace;
            flex-shrink: 0;
        }

        /* ---- Responsive breakpoints ---- */
        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                padding: 1.5rem;
                gap: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 0.85rem 1.25rem;
                padding-left: max(1.25rem, env(safe-area-inset-left));
                padding-right: max(1.25rem, env(safe-area-inset-right));
            }
            main { padding: 1.25rem; }
            .card { padding: 1.25rem; }
        }

        @media (max-width: 480px) {
            header {
                padding: 0.75rem 1rem;
                padding-left: max(1rem, env(safe-area-inset-left));
                padding-right: max(1rem, env(safe-area-inset-right));
            }
            .logo-group { font-size: 1rem; gap: 0.5rem; }
            .logo-icon { width: 20px; height: 20px; }
            .system-badge { font-size: 0.72rem; padding: 0.3rem 0.6rem; }
            main { padding: 1rem; gap: 1rem; }
            .card { padding: 1rem; border-radius: 10px; }
            .card-header { font-size: 0.8rem; margin-bottom: 1rem; }
            .btn-primary { font-size: 0.95rem; }
            .status-box { font-size: 0.82rem; padding: 0.75rem 0.85rem; }
            .log-list { max-height: 180px; }
            .log-item { font-size: 0.8rem; padding: 0.5rem 0.7rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-group">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 3H5a2 2 0 0 0-2 2v4m16-6h-4a2 2 0 0 1 2 2v4M3 15v4a2 2 0 0 0 2 2h4m12-6v4a2 2 0 0 1-2 2h-4"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span>Biometric Vision Matrix</span>
        </div>
        <div class="system-status">
            <div class="system-badge">
                <div class="badge-dot"></div>
                <span id="system-state-text">Model Engine Online</span>
            </div>
        </div>
    </header>

    <main>
        <section class="card">
            <div class="card-header">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="23 7 16 12 23 17 23 7"></polygon>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
                Live Optical Feed
            </div>
            <div class="viewport-wrapper" id="viewportWrapper">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="overlay"></canvas>
            </div>
        </section>

        <aside class="sidebar">
            <div class="card">
                <div class="card-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <polyline points="17 11 19 13 23 9"></polyline>
                    </svg>
                    Enroll Subject
                </div>
                <div class="form-group">
                    <label for="nameInput">Full Name / Subject ID</label>
                    <input type="text" id="nameInput" placeholder="e.g. Alex Mercer" autocomplete="off">
                </div>
                <button class="btn-primary" type="button" onclick="registerFace()">
                    Enroll Identity Profile
                </button>
                <div id="status" class="status-box" style="margin-top: 1rem;">
                    Initializing camera device...
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    Detection Telemetry
                </div>
                <div class="log-list" id="detectionLog">
                    <div class="log-item">
                        <span class="identity-badge unknown">No Detections</span>
                        <span class="confidence-val">--</span>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const nameInput = document.getElementById('nameInput');
        const detectionLog = document.getElementById('detectionLog');
        const viewportWrapper = document.getElementById('viewportWrapper');

        let isRecognizing = false;

        async function setupCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setStatus("Camera API unavailable. Serve over HTTPS or localhost.", "error");
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'user' } },
                    audio: false
                });
                video.srcObject = stream;

                video.onloadedmetadata = () => {
                    // Match the wrapper's aspect ratio to the actual video stream
                    // so the overlay canvas maps 1:1 to the visible feed on any device.
                    if (video.videoWidth && video.videoHeight) {
                        viewportWrapper.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
                    }
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    setStatus("Optical sensor linked. Ready for scan.", "neutral");
                    setInterval(processFrame, 400);
                };
            } catch (err) {
                setStatus("Camera permissions denied or device missing.", "error");
            }
        }

        function setStatus(text, type) {
            statusDiv.innerText = text;
            statusDiv.className = `status-box ${type}`;
        }

        function captureImage() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            tempCanvas.getContext('2d').drawImage(video, 0, 0);
            return tempCanvas.toDataURL('image/jpeg', 0.8);
        }

        async function processFrame() {
            if (isRecognizing || video.paused || video.ended) return;
            isRecognizing = true;
            const imageData = captureImage();

            try {
                const response = await fetch('/recognize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });
                const data = await response.json();
                if (data.faces) {
                    drawResults(data.faces);
                    updateTelemetryLog(data.faces);
                }
            } catch (err) {
                console.error("Transmission error:", err);
            } finally {
                isRecognizing = false;
            }
        }

        function drawResults(faces) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ratio of internal pixels per CSS pixel — keeps strokes / fonts legible
            // when the canvas is displayed smaller than its natural resolution (mobile).
            const rect = canvas.getBoundingClientRect();
            const ui = rect.width > 0 ? canvas.width / rect.width : 1;

            faces.forEach(face => {
                const [x, y, w, h] = face.box;
                const isKnown = face.name !== "Unknown";
                const strokeColor = isKnown ? '#22c55e' : '#ef4444';

                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = Math.max(2, Math.round(2 * ui));

                const cornerLen = Math.min(w, h) * 0.2;

                // Top-Left
                ctx.beginPath();
                ctx.moveTo(x, y + cornerLen);
                ctx.lineTo(x, y);
                ctx.lineTo(x + cornerLen, y);
                ctx.stroke();

                // Top-Right
                ctx.beginPath();
                ctx.moveTo(x + w - cornerLen, y);
                ctx.lineTo(x + w, y);
                ctx.lineTo(x + w, y + cornerLen);
                ctx.stroke();

                // Bottom-Left
                ctx.beginPath();
                ctx.moveTo(x, y + h - cornerLen);
                ctx.lineTo(x, y + h);
                ctx.lineTo(x + cornerLen, y + h);
                ctx.stroke();

                // Bottom-Right
                ctx.beginPath();
                ctx.moveTo(x + w - cornerLen, y + h);
                ctx.lineTo(x + w, y + h);
                ctx.lineTo(x + w, y + h - cornerLen);
                ctx.stroke();

                // Label background + text (scaled so it reads at ~13 CSS px on any screen)
                const label = isKnown
                    ? `${face.name} [${(face.confidence * 100).toFixed(0)}%]`
                    : "UNIDENTIFIED";
                const fontPx = Math.max(13, Math.round(13 * ui));
                const padX = Math.round(7 * ui);
                const boxH = Math.round(26 * ui);

                ctx.font = `600 ${fontPx}px Inter, sans-serif`;
                const textWidth = ctx.measureText(label).width;

                ctx.fillStyle = strokeColor;
                ctx.fillRect(x, y - boxH, textWidth + padX * 2, boxH);

                ctx.fillStyle = '#000000';
                ctx.textBaseline = 'middle';
                ctx.fillText(label, x + padX, y - boxH / 2);
                ctx.textBaseline = 'alphabetic';
            });
        }

        function updateTelemetryLog(faces) {
            if (faces.length === 0) {
                detectionLog.innerHTML = `
                    <div class="log-item">
                        <span class="identity-badge unknown">Scanning area...</span>
                        <span class="confidence-val">--</span>
                    </div>`;
                return;
            }

            detectionLog.innerHTML = faces.map(face => {
                const isKnown = face.name !== "Unknown";
                const confText = isKnown ? `${(face.confidence * 100).toFixed(1)}%` : '--';
                return `
                    <div class="log-item">
                        <span class="identity-badge ${isKnown ? 'known' : 'unknown'}">
                            ${face.name}
                        </span>
                        <span class="confidence-val">${confText}</span>
                    </div>`;
            }).join('');
        }

        async function registerFace() {
            const name = nameInput.value.trim();
            if (!name) {
                setStatus("Name input required before scanning.", "error");
                return;
            }

            setStatus("Capturing biometric vector...", "neutral");
            const imageData = captureImage();

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, image: imageData })
                });
                const data = await response.json();
                if (response.ok) {
                    setStatus(data.message, "success");
                    nameInput.value = "";
                } else {
                    setStatus(`Enrollment failure: ${data.error}`, "error");
                }
            } catch (err) {
                setStatus("Network failure while sending payload.", "error");
            }
        }

        setupCamera();
    </script>
</body>
</html>
